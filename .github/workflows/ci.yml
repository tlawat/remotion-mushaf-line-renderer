name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest, Playwright, tsup and the Remotion renderer run under Node; Bun installs and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint (Biome)
        run: bun run check

      - name: Unit tests (compiler + package)
        run: bun run test

      - name: Build the package
        run: bun run build

      - name: Typecheck sources, tests and the example (the example consumes the built package)
        run: |
          bun run test:types
          bun run typecheck

      - name: Packaging checks (exports, sizes, tarball, arethetypeswrong)
        run: bun run check:package

      - name: Fixture font for the browser and render suites (when not committed)
        run: test -f example/public/fonts/qpc-v4-tajweed/p10.ttf || bun run qul fonts 10

      - name: Mirror of QUL's exports for the real-data tests (when not committed)
        run: test -f example/public/data/qpc-v4/layout.db.zip || bun run qul data

      - name: Install Chromium for Playwright and Remotion
        run: bunx playwright install --with-deps chromium

      - name: Browser suite (Playwright against the example's Player harness)
        run: bun run test:browser

      - name: Render suite (@remotion/bundler + @remotion/renderer)
        run: bun run test:render

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            packages/remotion-mushaf-line-renderer/test-results
            packages/remotion-mushaf-line-renderer/test/render/*.png
