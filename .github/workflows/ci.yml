name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # vitest, Playwright, tsup and the Remotion renderer run under Node; Bun installs and runs the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint (Biome)
        run: bun run check

      - name: Unit tests (compiler, package, Mushaf Studio)
        run: bun run test

      - name: Build the packages (the renderer, then Mushaf Studio)
        run: bun run build

      - name: Typecheck sources, tests, the example and the Mushaf Studio app (both consume the built packages)
        run: |
          bun run test:types
          bun run typecheck

      - name: Packaging checks (exports, sizes, tarball, arethetypeswrong)
        run: bun run check:package

      # No font file is committed: the fonts packages' fonts/ folders are filled from QUL's CDN and
      # checked byte for byte against the manifests, and the suites' fixture page is downloaded. Both
      # are cached between runs on the manifests and the ETag survey.
      - name: Cache the page fonts
        uses: actions/cache@v4
        with:
          path: |
            packages/fonts-qpc-v4/fonts
            packages/fonts-qpc-v4-tajweed/fonts
            example/public/fonts
            packages/remotion-mushaf-line-renderer/test/fixtures/fonts
          key: qul-fonts-${{ hashFiles('packages/fonts-*/manifest.json', 'scripts/cdn-etags.json') }}

      - name: Fonts packages (fill from the CDN, verify, tarball)
        run: |
          bun run fonts-packages:fill
          bun run check:fonts-packages

      - name: Fixture font and the shared fonts for the browser and render suites (when not cached)
        run: |
          test -f example/public/fonts/qpc-v4-tajweed/p10.ttf \
            && test -f example/public/fonts/surah-names-v4/surah_names.woff2 \
            && test -f example/public/fonts/quran-common/quran-common.woff2 \
            || bun run qul fonts 10

      - name: Mirror of QUL's exports for the real-data tests (when not committed)
        run: test -f example/public/data/qpc-v4/layout.db.zip || bun run qul data

      - name: Install Chromium for Playwright and Remotion
        run: bunx playwright install --with-deps chromium

      - name: Browser suite (Playwright against the example's Player harness)
        run: bun run test:browser

      - name: Render suite (@remotion/bundler + @remotion/renderer)
        run: bun run test:render

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            packages/remotion-mushaf-line-renderer/test-results
            packages/remotion-mushaf-line-renderer/test/render/*.png
