name: Release

# Publishes the main package, @tlawat/remotion-mushaf-line, to npm with provenance.
#   - Pushing a tag v<version> publishes it; the tag must match the version in
#     packages/remotion-mushaf-line-renderer/package.json.
#   - Run workflow publishes with --dry-run by default, and always when it does not run on a tag.
# Publish the fonts packages (the "Fonts packages" workflow) first when they changed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: publish with --dry-run
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint (Biome)
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build the package
        run: bun run build

      - name: Typecheck
        run: |
          bun run test:types
          bun run typecheck

      - name: Packaging checks
        run: bun run check:package

      - name: Check the tag against the package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/remotion-mushaf-line-renderer/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the package version $version (expected v$version)"
            exit 1
          fi

      - name: Publish
        working-directory: packages/remotion-mushaf-line-renderer
        run: npm publish --provenance --access public ${{ (inputs.dry_run || github.event_name != 'push' || github.ref_type != 'tag') && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
