# Downloads the QUL page fonts and compiles the KFGQPC V4 layout data on a GitHub runner (this
# sandbox and some networks cannot reach qul.tarteel.ai), then commits the results to the branch the
# workflow was dispatched on.
#
# What gets committed (when `commit` is true):
#   packages/remotion-mushaf-line-renderer/src/data/qpc-v4.generated.ts   the compiled layout (ASCII)
#   scripts/cdn-etags.json                                                 ETags of every CDN font
#   example/public/fonts/<mushaf>/p{1,10,604}.{ttf,woff2}                  fixture fonts (development only:
#   packages/remotion-mushaf-line-renderer/test/fixtures/fonts/<mushaf>/... see .gitignore for the rule)
#
# Fonts of other pages are downloaded when asked for (`fonts: all`) but stay ignored by git.
name: QUL assets

on:
  workflow_dispatch:
    inputs:
      fonts:
        description: 'Pages whose fonts to download: a list/ranges such as "1,10,604" or "1-20", or "all"'
        default: '1,10,604'
        type: string
      compile:
        description: 'Compile the layout data from QUL preview pages (604 requests, cached between runs)'
        default: true
        type: boolean
      commit:
        description: 'Commit the generated module, cdn-etags.json and the fixture fonts to this branch'
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: qul-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FONTS: ${{ inputs.fonts }}
      COMPILE: ${{ inputs.compile }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the QUL preview page cache
        uses: actions/cache@v4
        with:
          path: .cache/qul
          key: qul-preview-layout-19-${{ github.run_id }}
          restore-keys: |
            qul-preview-layout-19-

      - name: Fetch fonts (and compile the layout)
        env:
          DEBUG: '1'
        run: |
          set -euo pipefail
          args=(--fonts "$FONTS" --etags)
          if [ "$COMPILE" = "true" ]; then
            args=(--from-pages "${args[@]}")
          fi
          echo "node scripts/fetch-qul.mjs ${args[*]}"
          node scripts/fetch-qul.mjs "${args[@]}" 2>&1 | tee fetch-qul.log

      - name: Verify the CDN (plain and tajweed sets, CORS, ETags)
        run: |
          set -uo pipefail
          if [ "$FONTS" = "all" ]; then
            node scripts/verify-cdn.mjs --all 2>&1 | tee verify-cdn.log
          else
            node scripts/verify-cdn.mjs --pages "$FONTS" 2>&1 | tee verify-cdn.log
          fi
          exit 0

      - name: Validate the compiled data with the package tests
        if: inputs.compile
        run: pnpm exec vitest run --project unit

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qul-assets-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            packages/remotion-mushaf-line-renderer/src/data/qpc-v4.generated.ts
            scripts/cdn-etags.json
            .cache/qul/report.json
            fetch-qul.log
            verify-cdn.log

      - name: Commit the results
        if: inputs.commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only files that .gitignore allows are picked up: the module, the ETags, and the fixture
          # fonts of pages 1, 10 and 604. Fonts of other pages stay out of the repository.
          git add packages/remotion-mushaf-line-renderer/src/data/qpc-v4.generated.ts scripts/cdn-etags.json
          git add example/public/fonts packages/remotion-mushaf-line-renderer/test/fixtures/fonts
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git status --short
          git commit -m "Compile QUL layout 19 data and add fixture fonts" \
            -m "Fonts requested: ${FONTS}. Generated by the QUL assets workflow, run ${{ github.run_id }}."
          git push origin "HEAD:${{ github.ref_name }}"
