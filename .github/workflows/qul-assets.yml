# Mirrors QUL's assets on a GitHub runner (some networks cannot reach QUL) and commits the results
# to the branch the workflow ran on: the two data exports the package fetches at runtime (downloaded
# from the URLs pinned in scripts/lib/datasets.mjs, validated against the printed page's invariants,
# recorded with ETag, sha256 and CORS header) and the page fonts.
#
# Runs on "Run workflow" (inputs below) and on pushes that touch the data tools or this file
# (defaults: data on, fonts 1,10,187,604, compare off, commit on).
#
# What gets committed (when committing is on):
#   example/public/data/qpc-v4/{words.json.zip,layout.db.zip}      the mirrored exports (open data)
#   scripts/cdn-etags.json                                         ETags of every CDN font + the exports
#   example/public/fonts/<set>/p{1,10,187,604}.{ttf,woff2}         fixture fonts (development only:
#   packages/remotion-mushaf-line-renderer/test/fixtures/fonts/<set>/...   see .gitignore for the rule)
#
# With `fonts: all` the example's mirror of every page's woff2 is committed as well (development
# only, see .gitignore); `bun run qul mirror` does the same from a developer's machine.
name: QUL assets

on:
  workflow_dispatch:
    inputs:
      data:
        description: 'Download QUL''s words and layout exports into example/public/data and validate them'
        default: true
        type: boolean
      fonts:
        description: 'Pages whose fonts to download: a list/ranges such as "1,10,604" or "1-20", or "all"'
        default: '1,10,187,604'
        type: string
      compare:
        description: 'Also compile QUL''s preview pages (604 requests, cached between runs) and compare them with the exports'
        default: false
        type: boolean
      commit:
        description: 'Commit the mirrored exports, cdn-etags.json and the fixture fonts to this branch'
        default: true
        type: boolean
  push:
    paths:
      - '.github/workflows/qul-assets.yml'
      - 'scripts/qul.mjs'
      - 'scripts/lib/**'

permissions:
  contents: write

concurrency:
  group: qul-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Empty on push events; the shell falls back to the defaults.
      DATA: ${{ github.event_name == 'push' || inputs.data }}
      FONTS: ${{ inputs.fonts || '1,10,187,604' }}
      COMPARE: ${{ github.event_name != 'push' && inputs.compare }}
      COMMIT: ${{ github.event_name == 'push' || inputs.commit }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore the QUL preview page cache
        if: env.COMPARE == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/qul
          key: qul-preview-layout-19-${{ github.run_id }}
          restore-keys: |
            qul-preview-layout-19-

      - name: Mirror the exports
        if: env.DATA == 'true'
        env:
          DEBUG: '1'
        run: node scripts/qul.mjs data 2>&1 | tee data.log

      - name: Compare the preview pages with the exports
        if: env.COMPARE == 'true'
        env:
          DEBUG: '1'
        run: node scripts/qul.mjs compare 2>&1 | tee compare.log

      - name: Download the fonts and record the ETags
        env:
          DEBUG: '1'
        run: node scripts/qul.mjs fonts "$FONTS" --etags 2>&1 | tee fonts.log

      - name: Verify the CDN (exports, both font sets, CORS, ETags)
        run: |
          set -uo pipefail
          if [ "$FONTS" = "all" ]; then
            node scripts/qul.mjs verify --data --all 2>&1 | tee verify.log
          else
            node scripts/qul.mjs verify --data --pages "$FONTS" 2>&1 | tee verify.log
          fi
          exit 0

      - name: Validate the mirrored exports with the package tests (the runtime loader, the invariants, the dev-tools route)
        run: bun run test

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qul-assets-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            example/public/data
            scripts/cdn-etags.json
            data.log
            compare.log
            fonts.log
            verify.log

      - name: Commit the results
        if: env.COMMIT == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Only files that .gitignore allows are picked up: the exports, the ETags, the fixture fonts
          # of pages 1, 10, 187 and 604, and (development only) the example's woff2 mirror.
          git add example/public/data scripts/cdn-etags.json
          git add example/public/fonts packages/remotion-mushaf-line-renderer/test/fixtures/fonts
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi
          git status --short
          git commit -m "Mirror QUL's exports and add fixture fonts" \
            -m "Fonts requested: ${FONTS}. Generated by the QUL assets workflow, run ${{ github.run_id }}."
          git push origin "HEAD:${{ github.ref_name }}"
